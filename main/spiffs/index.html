<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANBoard Configuration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0.6em 1.2em; }
        .header-row { display:flex; align-items:center; justify-content:space-between; gap:1em; margin-bottom:0.6em; }
        .header-row { flex-wrap: nowrap; }
        h2 { margin: 0; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 2em; table-layout: fixed; }
        th, td { border: 1px solid #ccc; padding: 0.35em 0.4em; text-align: center; }
        /* Center the Input (1st) and Pullup header (4th) */
        td:nth-child(1) { text-align: center; }
        th:nth-child(2), th:nth-child(4), th:nth-child(5), th:nth-child(8), th:nth-child(9), th:nth-child(10), th:nth-child(11) { text-align: left; }
        
        td:nth-child(12) { text-align: center; }
        /* Center the Filtering column (7th) and its checkboxes */
        th:nth-child(7), td:nth-child(7) { text-align: center; }
        td:nth-child(7) input { transform: scale(1.1); }
        td:nth-child(6) input { transform: scale(1.1); }

        .input-container { display: flex; width: 100%; gap: 0.35em; }
        .input-container .input-box { flex: 1 1 auto; }
        .input-container .unit { flex: 0 0 25px; display: flex; align-items: center; font-size:0.9rem; color:#555; }
        .input-container .unit-ohm { flex: 0 0 10px; display: flex; align-items: center; font-size:0.9rem; color:#555; }
        
        /* Remove numeric up/down controls for inputs where we don't want spinners */
        input.no-spin::-webkit-outer-spin-button,
        input.no-spin::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input.no-spin {
            -moz-appearance: textfield;
        }
        th { background: #f0f0f0; }
        input, select, textarea { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 0.95rem; padding: 0.25em; }
        .top-actions { display: flex; justify-content: flex-end; gap: 0.5em; }
        .action-btn { background: #337ab7; color: #fff; border: none; padding: 0.35em 0.9em; font-size: 0.95rem; border-radius: 4px; cursor: pointer; height:36px; }
        .action-btn.negative { background: #d9534f; }
        .action-btn.backup { background: #f39c12; color: #fff; }
        .action-btn.backup:hover { background: #e08e0f; }
        .action-btn.restore { background: #27ae60; color: #fff; }
        .action-btn.restore:hover { background: #229954; }
        .action-btn:disabled { background: #aaa; cursor: not-allowed; }
        .controls-inline { display:flex; align-items:center; gap:0.75em; flex-wrap: nowrap; }
        .header-controls { min-width: 0; }
        .header-controls { margin-right: 0.9em; }
        .vref-inline { display:flex; align-items:center; gap:0.25rem; margin-left:0.6em; white-space:nowrap; }
        .small-select { max-width:12ch; width:100%; box-sizing: border-box; }
        /* Keep header selects compact rather than expanding to fill their flex container */
        .header-row .small-select { width:12ch; max-width:12ch; }
        .punit-select { width:100%; box-sizing: border-box; }
        .ntc-select { width:100%; box-sizing: border-box; }
        .hex-input { width:6ch; }
        .small-input { width:5.5ch; }
        .hex-prefix { margin-right:0.2em; }
        .overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            z-index: 9999;
        }
        .overlay-card {
            min-width: 260px;
            max-width: 420px;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            background: #fff;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #d0d0d0;
            border-top-color: #337ab7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            flex: 0 0 auto;
        }
        .overlay-text {
            font-size: 0.98rem;
            color: #222;
        }
        .toast {
            position: fixed;
            bottom: 14px;
            right: 14px;
            min-width: 220px;
            max-width: 380px;
            padding: 0.65rem 0.85rem;
            border-radius: 6px;
            color: #222;
            background: #fff;
            border: 1px solid #9a9a9a;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 10000;
            font-size: 0.94rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.error {
            border-color: #e7b1af;
        }
        .toast.success {
            border-color: #b8dcbc;
        }
        .toast-icon {
            display: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #27ae60;
            color: #fff;
            font-size: 0.75rem;
            line-height: 18px;
            text-align: center;
            flex: 0 0 18px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <form id="config-form" novalidate>
    <div class="header-row">
        <h2>CANBoard Configuration</h2>
        <div class="top-actions">
            <div class="controls-inline header-controls">
                <label for="can-speed">CAN Speed:</label>
                <select id="can-speed" name="can_speed_kbps" class="small-select">
                    <option value="125">125kbps</option>
                    <option value="250">250kbps</option>
                    <option value="500">500kbps</option>
                    <option value="1000">1000kbps</option>
                </select>

                <label for="can-tx-rate">CAN TX:</label>
                <select id="can-tx-rate" name="can_tx_hz" class="small-select">
                    <option value="25">25Hz</option>
                    <option value="50">50Hz</option>
                </select>

                <label for="base-can-id">Base CAN ID:</label>
                <div style="display:flex; align-items:center;">
                    <span class="hex-prefix">0x</span>
                    <input id="base-can-id" name="can_start_id" class="hex-input" maxlength="3" value="620" />
                </div>
                <div class="vref-inline">
                    <span style="font-size:0.95rem; color:#333;">vRef:</span>
                    <span id="v5-rail" class="unit">-- mV</span>
                </div>
                <!-- vRef is measured live; pullup_vref field removed -->
            </div>
            <button id="save-btn" class="action-btn" type="submit">Save Config</button>
            <button id="backup-btn" class="action-btn backup" type="button">Backup</button>
            <input id="restore-file" type="file" accept="application/json" style="display:none" />
            <button id="restore-btn" class="action-btn restore" type="button">Restore</button>
            <button id="reboot-btn" class="action-btn negative" type="button">Reboot Device</button>
        </div>
    </div>
    <table>
        <colgroup>
            <col style="width:60px">    <!-- Channel -->
            <col>                     <!-- Name (flexible) -->
            <col style="width:7%">    <!-- Sensor Type -->
            <col style="width:6%">    <!-- Pullup -->
            <col style="width:11%">    <!-- NTC Table -->
            <col style="width:5%">     <!-- Unit -->
            <col style="width:6%">    <!-- Filtering -->
            <col style="width:8%">    <!-- Pressure Min mV -->
            <col style="width:8%">    <!-- Pressure Max mV -->
            <col style="width:8%">    <!-- Pressure Min kPa -->
            <col style="width:8%">    <!-- Pressure Max kPa -->
            <col style="width:7%">    <!-- Voltage -->
            <col style="width:7%">    <!-- Value -->
        </colgroup>
            <thead>
                <tr>
                    <th>Input</th>
                    <th>Name</th>
                    <th>Sensor Type</th>
                    <th>Pullup</th>
                    <th>NTC Table</th>
                    <th>Unit</th>
                    <th>Filtering</th>
                    <th>Voltage Min</th>
                    <th>Voltage Max</th>
                    <th>Pressure Min</th>
                    <th>Pressure Max</th>
                    <th>Voltage</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody id="channels-tbody">
                <!-- JS will populate rows -->
            </tbody>
        </table>
    </form>
    <div id="status-toast" class="toast" role="status" aria-live="polite">
        <span id="status-toast-icon" class="toast-icon">✓</span>
        <span id="status-toast-text"></span>
    </div>
    <div id="loading-overlay" class="overlay" aria-live="polite" aria-busy="true">
        <div class="overlay-card" role="status">
            <div class="spinner"></div>
            <div id="overlay-text" class="overlay-text">Working...</div>
        </div>
    </div>
    <script>
    const SENSOR_TYPES = ["Raw", "NTC", "Pressure"];
    const NTC_TABLES = ["Bosch 0280130026", "Bosch TMAP 0281002437", "Universal 1/8 NPT", "FAE 33166", "Bosch 0280130055"];

    // Unit conversion helpers: UI displays values in the selected unit
    // but configuration is stored canonically in kPa. Use these helpers
    // to convert between kPa <-> bar/psi for display and saving.
    // Display: integers for all units (UI shows integer values only).
    function convertKpaToUnit(kpa, unit) {
        if (kpa === null || typeof kpa === 'undefined' || isNaN(parseFloat(kpa))) return '';
        kpa = parseFloat(kpa);
        switch (unit) {
            case 1: // bar
                return Math.round(kpa / 100.0).toString();
            case 2: // psi
                return Math.round(kpa / 6.89476).toString();
            default: // kPa
                return Math.round(kpa).toString();
        }
    }

    function convertUnitToKpa(value, unit) {
        if (value === null || typeof value === 'undefined' || isNaN(parseFloat(value))) return NaN;
        value = parseFloat(value);
        switch (unit) {
            case 1: // bar
                return value * 100.0;
            case 2: // psi
                return value * 6.89476;
            default: // kPa
                return value;
        }
    }

    let config = null;
    const loadingOverlay = document.getElementById('loading-overlay');
    const overlayText = document.getElementById('overlay-text');
    const statusToast = document.getElementById('status-toast');
    const statusToastIcon = document.getElementById('status-toast-icon');
    const statusToastText = document.getElementById('status-toast-text');
    let toastTimer = null;

    function showOverlay(message) {
        if (overlayText) {
            if (message) {
                overlayText.style.display = '';
                overlayText.textContent = message;
            } else {
                overlayText.style.display = 'none';
                overlayText.textContent = '';
            }
        }
        if (loadingOverlay) loadingOverlay.style.display = 'flex';
    }

    function hideOverlay() {
        if (loadingOverlay) loadingOverlay.style.display = 'none';
    }

    function setStatus(message, isError, withSuccessIcon) {
        if (!statusToast || !statusToastText || !message) return;
        statusToastText.textContent = message;
        if (statusToastIcon) {
            statusToastIcon.style.display = withSuccessIcon ? 'inline-block' : 'none';
        }
        statusToast.classList.remove('error', 'success', 'show');
        statusToast.classList.add(isError ? 'error' : 'success');
        void statusToast.offsetWidth;
        statusToast.classList.add('show');
        if (toastTimer) {
            clearTimeout(toastTimer);
        }
        toastTimer = setTimeout(() => {
            statusToast.classList.remove('show');
        }, isError ? 4500 : 2500);
    }

    function createRow(idx, ch) {
        const isNTC = ch.type == 1;
        const isPressure = ch.type == 2;
        return `<tr>
            <td style="text-align:center">${idx+1}</td>
            <td><input name="name${idx}" maxlength="32" value="${ch.name || ''}" required></td>
            <td><select name="type${idx}">
                ${SENSOR_TYPES.map((t,i)=>`<option value="${i}"${ch.type==i?' selected':''}>${t}</option>`).join('')}
            </select></td>
            <td>
                <div class="input-container">
                    <div class="input-box"><input name="pullup${idx}" class="no-spin" type="number" min="0" max="100000" value="${ch.pullup_ohms || 0}" ${isNTC ? '' : 'disabled'}></div>
                    <div class="unit-ohm">Ω</div>
                </div>
            </td>
            <td><select name="ntc${idx}" class="ntc-select" ${isNTC ? '' : 'disabled'}>
                ${NTC_TABLES.map((t,i)=>`<option value="${i}"${ch.params?.ntc?.table_id==i?' selected':''}>${t}</option>`).join('')}
            </select></td>
            <td><select name="punit${idx}" class="punit-select" ${isPressure ? '' : 'disabled'}>
                    <option value="0"${(ch.params && ch.params.pressure && typeof ch.params.pressure.pressure_unit !== 'undefined' && ch.params.pressure.pressure_unit==0)?' selected':''}>kPa</option>
                    <option value="1"${(ch.params && ch.params.pressure && typeof ch.params.pressure.pressure_unit !== 'undefined' && ch.params.pressure.pressure_unit==1)?' selected':''}>bar</option>
                    <option value="2"${(ch.params && ch.params.pressure && typeof ch.params.pressure.pressure_unit !== 'undefined' && ch.params.pressure.pressure_unit==2)?' selected':''}>psi</option>
                </select></td>
            <td><select name="filtering${idx}" ${isPressure ? '' : 'disabled'}>
                    <option value="0"${ch.filtering==0?' selected':''}>None</option>
                    <option value="1"${ch.filtering==1?' selected':''}>Low</option>
                    <option value="2"${ch.filtering==2?' selected':''}>Medium</option>
                    <option value="3"${ch.filtering==3?' selected':''}>High</option>
                </select></td>
            <td>
                <div class="input-container">
                    <div class="input-box">
                        <input name="pminmv${idx}" class="no-spin" type="number" min="0" max="5000" value="${(ch.params && ch.params.pressure && typeof ch.params.pressure.min_mv !== 'undefined') ? ch.params.pressure.min_mv : ''}" ${isPressure ? '' : 'disabled'}>
                    </div>
                    <div class="unit">mV</div>
                </div>
            </td>
            <td>
                <div class="input-container">
                    <div class="input-box"><input name="pmaxmv${idx}" class="no-spin" type="number" min="0" max="5000" value="${(ch.params && ch.params.pressure && typeof ch.params.pressure.max_mv !== 'undefined') ? ch.params.pressure.max_mv : ''}" ${isPressure ? '' : 'disabled'}></div>
                    <div class="unit">mV</div>
                </div>
            </td>
            <td>
                <div class="input-container">
                        <div class="input-box"><input name="pminkpa${idx}" class="no-spin" type="number" step="1" value="${(ch.params && ch.params.pressure && typeof ch.params.pressure.min_kpa !== 'undefined') ? ch.params.pressure.min_kpa : ''}" ${isPressure ? '' : 'disabled'}></div>
                    <div class="unit">kPa</div>
                </div>
            </td>
            <td>
                <div class="input-container">
                    <div class="input-box"><input name="pmaxkpa${idx}" class="no-spin" type="number" step="1" value="${(ch.params && ch.params.pressure && typeof ch.params.pressure.max_kpa !== 'undefined') ? ch.params.pressure.max_kpa : ''}" ${isPressure ? '' : 'disabled'}></div>
                    <div class="unit">kPa</div>
                </div>
            </td>
            <td><span id="live-voltage-${idx}">--</span></td>
            <td><span id="live-value-${idx}"></span></td>
        </tr>`;
    }

    function validateConfig(form) {
        let error = "";
        function getFormElem(name) {
            let el = form[name];
            if (!el) return null;
            if (typeof el.value === 'undefined' && el.length) el = el[0];
            return el;
        }
        for (let i = 0; i < 16; ++i) {
            const nameEl = getFormElem(`name${i}`);
            const name = nameEl ? nameEl.value.trim() : '';
            if (!name) error += `Channel ${i+1}: Name required. `;
            const pullupEl = getFormElem(`pullup${i}`);
            const pullup = pullupEl ? parseInt(pullupEl.value) : NaN;
            if (isNaN(pullup) || pullup < 0 || pullup > 100000) error += `Channel ${i+1}: Pullup invalid. `;
            const typeEl = getFormElem(`type${i}`);
            const type = typeEl ? parseInt(typeEl.value) : 0;
            if (type === 1) { // NTC
                const ntcEl = getFormElem(`ntc${i}`);
                if (!ntcEl || isNaN(parseInt(ntcEl.value))) error += `Channel ${i+1}: NTC table invalid. `;
            }
            if (type === 2) { // Pressure
                const minmvEl = getFormElem(`pminmv${i}`);
                const maxmvEl = getFormElem(`pmaxmv${i}`);
                const minkpaEl = getFormElem(`pminkpa${i}`);
                const maxkpaEl = getFormElem(`pmaxkpa${i}`);
                const unitEl = getFormElem(`punit${i}`);
                const minmv = minmvEl ? parseInt(minmvEl.value) : NaN;
                const maxmv = maxmvEl ? parseInt(maxmvEl.value) : NaN;
                const minkpa = minkpaEl ? parseFloat(minkpaEl.value) : NaN;
                const maxkpa = maxkpaEl ? parseFloat(maxkpaEl.value) : NaN;
                const unit = unitEl ? parseInt(unitEl.value) : NaN;
                if (isNaN(minmv) || isNaN(maxmv) || minmv >= maxmv) error += `Channel ${i+1}: Pressure mV min/max invalid. `;
                if (minmv < 0 || minmv > 5000 || maxmv < 0 || maxmv > 5000) error += `Channel ${i+1}: Pressure mV must be 0-5000. `;
                if (isNaN(minkpa) || isNaN(maxkpa) || minkpa >= maxkpa) error += `Channel ${i+1}: Pressure kPa min/max invalid. `;
                // Enforce integer-only values for displayed pressure fields
                if (!isNaN(minkpa) && !Number.isInteger(minkpa)) error += `Channel ${i+1}: Pressure min must be integer. `;
                if (!isNaN(maxkpa) && !Number.isInteger(maxkpa)) error += `Channel ${i+1}: Pressure max must be integer. `;
                const lvlEl = getFormElem(`filtering${i}`);
                const lvl = lvlEl ? parseInt(lvlEl.value) : NaN;
                if (isNaN(lvl) || lvl < 0 || lvl > 3) error += `Channel ${i+1}: Filter level invalid. `;
                if (isNaN(unit) || unit < 0 || unit > 2) error += `Channel ${i+1}: Pressure unit invalid. `;
            }
        }
        return error;
    }

    function fillTable() {
        const tbody = document.getElementById('channels-tbody');
        tbody.innerHTML = config.channels.map((ch,i)=>createRow(i,ch)).join('');
        // Store canonical kPa values in data attributes so we can display
        // them in the selected unit without losing precision.
        for (let i = 0; i < 16; ++i) {
            try {
                const ch = config.channels[i];
                if (!ch) continue;
                if (ch.params && ch.params.pressure) {
                    const pminkpa = ch.params.pressure.min_kpa;
                    const pmaxkpa = ch.params.pressure.max_kpa;
                    const minkEl = document.querySelector(`[name="pminkpa${i}"]`);
                    const maxEl = document.querySelector(`[name="pmaxkpa${i}"]`);
                    if (minkEl) minkEl.dataset.kpa = (typeof pminkpa !== 'undefined' && pminkpa !== null) ? pminkpa : '';
                    if (maxEl) maxEl.dataset.kpa = (typeof pmaxkpa !== 'undefined' && pmaxkpa !== null) ? pmaxkpa : '';
                }
            } catch (e) {
                // ignore per-row failures
            }
        }
        attachTypeHandlers();
        // Ensure the displayed numeric values reflect the selected unit.
        for (let i = 0; i < 16; ++i) updateUnitLabel(i);
    }

    function updateRowControls(i) {
        const typeSel = document.querySelector(`[name="type${i}"]`);
        if (!typeSel) return;
        const type = parseInt(typeSel.value);
        const isNTC = type === 1;
        const isPressure = type === 2;
        const ntc = document.querySelector(`[name="ntc${i}"]`);
        const pullup = document.querySelector(`[name="pullup${i}"]`);
        const pmin = document.querySelector(`[name="pminmv${i}"]`);
        const pmax = document.querySelector(`[name="pmaxmv${i}"]`);
        const kmin = document.querySelector(`[name="pminkpa${i}"]`);
        const kmax = document.querySelector(`[name="pmaxkpa${i}"]`);
        const filt = document.querySelector(`[name="filtering${i}"]`);
        const punit = document.querySelector(`[name="punit${i}"]`);
        if (ntc) ntc.disabled = !isNTC;
        if (pullup) pullup.disabled = !isNTC;
        if (pmin) pmin.disabled = !isPressure;
        if (pmax) pmax.disabled = !isPressure;
        if (kmin) kmin.disabled = !isPressure;
        if (kmax) kmax.disabled = !isPressure;
        if (punit) punit.disabled = !isPressure;
        if (filt) filt.disabled = !isPressure;
        updateUnitLabel(i);
    }

    function attachTypeHandlers() {
        for (let i = 0; i < 16; ++i) {
            const sel = document.querySelector(`[name="type${i}"]`);
            if (!sel) continue;
            sel.onchange = () => updateRowControls(i);
            updateRowControls(i);
            const punitSel = document.querySelector(`[name="punit${i}"]`);
            const pminEl = document.querySelector(`[name="pminkpa${i}"]`);
            const pmaxEl = document.querySelector(`[name="pmaxkpa${i}"]`);
            if (punitSel) {
                punitSel.onchange = () => updateUnitLabel(i);
            }
            // When the user edits the displayed value, update the canonical kPa dataset
            if (pminEl) {
                pminEl.oninput = function() {
                    const unit = punitSel ? parseInt(punitSel.value) : 0;
                    if (!isNaN(parseFloat(this.value))) this.dataset.kpa = convertUnitToKpa(this.value, unit);
                    else this.dataset.kpa = '';
                };
                pminEl.onblur = function() {
                    const unit = punitSel ? parseInt(punitSel.value) : 0;
                    const v = parseFloat(this.value);
                    if (!isNaN(v)) {
                        // Always display integer values
                        this.value = Math.round(v).toString();
                        this.dataset.kpa = convertUnitToKpa(this.value, unit);
                    } else {
                        this.dataset.kpa = '';
                        this.value = '';
                    }
                };
            }
            if (pmaxEl) {
                pmaxEl.oninput = function() {
                    const unit = punitSel ? parseInt(punitSel.value) : 0;
                    if (!isNaN(parseFloat(this.value))) this.dataset.kpa = convertUnitToKpa(this.value, unit);
                    else this.dataset.kpa = '';
                };
                pmaxEl.onblur = function() {
                    const unit = punitSel ? parseInt(punitSel.value) : 0;
                    const v = parseFloat(this.value);
                    if (!isNaN(v)) {
                        // Always display integer values
                        this.value = Math.round(v).toString();
                        this.dataset.kpa = convertUnitToKpa(this.value, unit);
                    } else {
                        this.dataset.kpa = '';
                        this.value = '';
                    }
                };
            }
            updateUnitLabel(i);
        }
    }

    function unitTextFromIndex(u) {
        return ['kPa', 'bar', 'psi'][u] || 'kPa';
    }

    function formatComputedValue(valueStr, idx) {
        if (!valueStr || typeof valueStr !== 'string') return '';
        const ch = (config && config.channels && config.channels[idx]) ? config.channels[idx] : null;
        const type = ch ? ch.type : null;
        const m = valueStr.match(/^(-?\d+(?:\.\d+)?)/);
        if (!m) return valueStr;
        const num = parseFloat(m[0]);
        const rest = valueStr.substring(m[0].length).trim();
        if (type === 2) { // Pressure
            const unitIdx = (ch.params && ch.params.pressure) ? ch.params.pressure.pressure_unit : 0;
            if (unitIdx === 1 || unitIdx === 2) {
                return num.toFixed(2) + (rest ? ' ' + rest : '');
            } else {
                return Math.round(num).toString() + (rest ? ' ' + rest : '');
            }
        } else if (type === 1) { // NTC
            return Math.round(num).toString() + (rest ? ' ' + rest : '');
        }
        return valueStr;
    }

    function updateUnitLabel(i) {
        const punitSel = document.querySelector(`[name="punit${i}"]`);
        let unitIndex = 0;
        let text = 'kPa';
        if (punitSel && !punitSel.disabled) {
            const v = parseInt(punitSel.value);
            if (!isNaN(v)) unitIndex = v;
            text = unitTextFromIndex(unitIndex);
        }

        function findUnitSpanForInput(inputEl) {
            if (!inputEl) return null;
            // prefer new wrapper class, fallback to old
            let container = inputEl.closest('.input-container') || inputEl.closest('.unit-wrap') || inputEl.parentElement;
            if (!container) return null;
            return container.querySelector('.unit');
        }

        const kminInput = document.querySelector(`[name="pminkpa${i}"]`);
        const kmaxInput = document.querySelector(`[name="pmaxkpa${i}"]`);
        const kminSpan = findUnitSpanForInput(kminInput);
        const kmaxSpan = findUnitSpanForInput(kmaxInput);
        if (kminSpan) kminSpan.textContent = text;
        if (kmaxSpan) kmaxSpan.textContent = text;
        // Convert displayed numeric values from canonical kPa to selected unit
        if (kminInput) {
            const kpaVal = (kminInput.dataset && typeof kminInput.dataset.kpa !== 'undefined' && kminInput.dataset.kpa !== '') ? parseFloat(kminInput.dataset.kpa) : (parseFloat(kminInput.value) || 0);
            const display = convertKpaToUnit(kpaVal, unitIndex);
            kminInput.value = display;
            // Always use integer step
            kminInput.step = '1';
        }
        if (kmaxInput) {
            const kpaVal = (kmaxInput.dataset && typeof kmaxInput.dataset.kpa !== 'undefined' && kmaxInput.dataset.kpa !== '') ? parseFloat(kmaxInput.dataset.kpa) : (parseFloat(kmaxInput.value) || 0);
            const display = convertKpaToUnit(kpaVal, unitIndex);
            kmaxInput.value = display;
            kmaxInput.step = '1';
        }
    }

    async function loadConfig() {
        const res = await fetch('/api/config');
        config = await res.json();
        fillTable();
        // Set CAN speed dropdown
        document.getElementById('can-speed').value = config.can_speed_kbps || 500;
        // Set CAN TX rate dropdown
        document.getElementById('can-tx-rate').value = (config.can_tx_hz === 50) ? 50 : 25;
        // Set base CAN ID (show hex without 0x prefix)
        const baseElem = document.getElementById('base-can-id');
        if (config.can_start_id !== undefined) {
            baseElem.value = config.can_start_id.toString(16).toUpperCase();
        }
        // vRef is measured live; no stored pullup_vref to set
        await refreshLiveValues();
    }

    async function refreshLiveValues() {
        try {
            const inputsRes = await fetch('/api/inputs', { cache: 'no-store' });
            if (!inputsRes.ok) {
                throw new Error(`Inputs HTTP ${inputsRes.status}`);
            }

            const live = await inputsRes.json();
            if (!live || !Array.isArray(live.channels)) {
                throw new Error('Inputs payload is invalid');
            }

            let computed = null;
            try {
                const valuesRes = await fetch('/api/live_values', { cache: 'no-store' });
                if (valuesRes.ok) {
                    computed = await valuesRes.json();
                    if (!computed || !Array.isArray(computed.channels)) {
                        throw new Error('Computed payload is invalid');
                    }
                } else {
                    console.warn(`Computed values HTTP ${valuesRes.status}`);
                }
            } catch (e) {
                // Keep showing vRef/voltages even if computed-value endpoint fails.
                computed = null;
                if (window.console && console.warn) {
                    console.warn('computed /api/live_values failed:', e);
                }
            }

            const v5elem = document.getElementById('v5-rail');
            if (v5elem) {
                if (typeof live.v5_rail_mv === 'number' && live.v5_rail_mv > 0) {
                    v5elem.textContent = `${live.v5_rail_mv} mV`;
                } else {
                    v5elem.textContent = `-- mV`;
                }
            }

            for (let i = 0; i < 16; ++i) {
                const ch = live.channels[i];
                if (!ch) continue;
                const voltageEl = document.getElementById(`live-voltage-${i}`);
                const valueEl = document.getElementById(`live-value-${i}`);

                if (voltageEl) {
                    if (ch.mv !== null && typeof ch.mv === 'number') {
                        voltageEl.textContent = `${ch.mv} mV`;
                    } else {
                        voltageEl.textContent = '--';
                    }
                }

                if (valueEl) {
                    const cv = computed && Array.isArray(computed.channels) ? computed.channels[i] : null;
                    if (cv && typeof cv.value === 'string') {
                        valueEl.textContent = formatComputedValue(cv.value, i);
                    } else {
                        valueEl.textContent = '';
                    }
                }
            }
        } catch (e) {
            const v5elem = document.getElementById('v5-rail');
            if (v5elem) v5elem.textContent = '-- mV';

            for (let i = 0; i < 16; ++i) {
                const voltageEl = document.getElementById(`live-voltage-${i}`);
                const valueEl = document.getElementById(`live-value-${i}`);
                if (voltageEl) voltageEl.textContent = '--';
                if (valueEl) valueEl.textContent = '';
            }

            if (window.console && console.warn) {
                console.warn('refreshLiveValues failed:', e);
            }
        }
    }

    document.getElementById('config-form').onsubmit = async function(e) {
        e.preventDefault();
        const form = e.target;
        const error = validateConfig(form);
        if (error) { setStatus(error, true); return; }
        // Build config object
        config.can_speed_kbps = parseInt(document.getElementById('can-speed').value);
        config.can_tx_hz = (parseInt(document.getElementById('can-tx-rate').value) === 50) ? 50 : 25;
        // Read base CAN ID from hex input (allow decimal as fallback)
        const baseVal = document.getElementById('base-can-id').value.trim();
        if (/^0x/i.test(baseVal)) {
            config.can_start_id = parseInt(baseVal, 16);
        } else if (/^[0-9A-Fa-f]+$/.test(baseVal)) {
            config.can_start_id = parseInt(baseVal, 16);
        } else {
            const dec = parseInt(baseVal);
            config.can_start_id = isNaN(dec) ? (config.can_start_id || 0x620) : dec;
        }
        function getFormElem(name) {
            let el = form[name];
            if (!el) return null;
            if (typeof el.value === 'undefined' && el.length) el = el[0];
            return el;
        }
        for (let i = 0; i < 16; ++i) {
            const nameEl = getFormElem(`name${i}`);
            const pullupEl = getFormElem(`pullup${i}`);
            const typeEl = getFormElem(`type${i}`);
            const filtEl = getFormElem(`filtering${i}`);
            config.channels[i].name = nameEl ? nameEl.value.trim() : '';
            config.channels[i].pullup_ohms = pullupEl ? parseInt(pullupEl.value) : 0;
            config.channels[i].type = typeEl ? parseInt(typeEl.value) : 0;
            config.channels[i].filtering = filtEl ? parseInt(filtEl.value) : 0;
            config.channels[i].params = {};
                if (config.channels[i].type === 1) {
                    const ntcEl = getFormElem(`ntc${i}`);
                    config.channels[i].params.ntc = { table_id: ntcEl ? parseInt(ntcEl.value) : 0 };
                } else if (config.channels[i].type === 2) {
                    const minmvEl = getFormElem(`pminmv${i}`);
                    const maxmvEl = getFormElem(`pmaxmv${i}`);
                    const minkpaEl = getFormElem(`pminkpa${i}`);
                    const maxkpaEl = getFormElem(`pmaxkpa${i}`);
                    const punitEl = getFormElem(`punit${i}`);
                    // Prefer canonical kPa stored in data attribute (set when table is filled)
                    let min_kpa_value = 0.0;
                    let max_kpa_value = 0.0;
                    const unitIdx = punitEl ? parseInt(punitEl.value) : 0;
                    if (minkpaEl) {
                        if (minkpaEl.dataset && typeof minkpaEl.dataset.kpa !== 'undefined' && minkpaEl.dataset.kpa !== '') {
                            min_kpa_value = parseFloat(minkpaEl.dataset.kpa);
                        } else {
                            min_kpa_value = !isNaN(parseFloat(minkpaEl.value)) ? convertUnitToKpa(parseFloat(minkpaEl.value), unitIdx) : 0.0;
                        }
                    }
                    if (maxkpaEl) {
                        if (maxkpaEl.dataset && typeof maxkpaEl.dataset.kpa !== 'undefined' && maxkpaEl.dataset.kpa !== '') {
                            max_kpa_value = parseFloat(maxkpaEl.dataset.kpa);
                        } else {
                            max_kpa_value = !isNaN(parseFloat(maxkpaEl.value)) ? convertUnitToKpa(parseFloat(maxkpaEl.value), unitIdx) : 0.0;
                        }
                    }
                    config.channels[i].params.pressure = {
                        min_mv: minmvEl ? parseInt(minmvEl.value) : 0,
                        max_mv: maxmvEl ? parseInt(maxmvEl.value) : 0,
                        min_kpa: min_kpa_value,
                        max_kpa: max_kpa_value,
                        pressure_unit: punitEl ? parseInt(punitEl.value) : 0
                    };
            }
        }
        try {
            let payload = null;
            try {
                payload = JSON.stringify(config);
            } catch (jerr) {
                console.error('Failed to serialize config', jerr, config);
                setStatus('Failed to serialize config', true);
                return;
            }
            console.log('Posting config payload:', payload);
            const resp = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: payload
            });
            if (resp.ok) {
                setStatus('Config saved.', false, true);
            } else {
                setStatus('Failed to save config.', true);
            }
        } catch (e) {
            setStatus('Failed to save config.', true);
        }
    };

    document.getElementById('reboot-btn').onclick = async function() {
        let secondsLeft = 10;
        showOverlay(`Rebooting device... Refreshing in ${secondsLeft} seconds`);
        try {
            await fetch('/api/reboot', { method: 'POST' });
        } catch (e) {
            // Ignore errors because reboot can drop HTTP connection abruptly
        }
        const countdown = setInterval(() => {
            secondsLeft -= 1;
            if (secondsLeft > 0) {
                showOverlay(`Rebooting device... Refreshing in ${secondsLeft} seconds`);
                return;
            }
            clearInterval(countdown);
            showOverlay('Rebooting device... Refreshing now');
            window.location.reload();
        }, 1000);
    };

    // Backup (download JSON) — filename uses client time ddmmyy-hhmmss
    document.getElementById('backup-btn').onclick = async function() {
        try {
            const resp = await fetch('/api/config/export.json');
            if (!resp.ok) { setStatus('Failed to download config.', true); return; }
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            const dd = pad(now.getDate());
            const mm = pad(now.getMonth() + 1);
            const yy = pad(now.getFullYear() % 100);
            const hh = pad(now.getHours());
            const mi = pad(now.getMinutes());
            const ss = pad(now.getSeconds());
            const datetime = `${dd}${mm}${yy}-${hh}${mi}${ss}`; // ddmmyy-hhmmss
            a.download = `esp32-canboard-config-${datetime}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        } catch (e) {
            // No toast needed for backup flow
        }
    };

    // Restore (upload JSON)
    document.getElementById('restore-btn').onclick = function() {
        document.getElementById('restore-file').click();
    };

    document.getElementById('restore-file').onchange = async function(e) {
        const f = e.target.files[0];
        if (!f) return;
        if (!confirm('Restore configuration from selected file? Existing config will be overwritten.')) return;
        try {
            const text = await f.text();
            const resp = await fetch('/api/config/import.json', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: text });
            if (resp.ok) {
                setTimeout(() => {
                    window.location.reload();
                }, 900);
            } else {
                // No toast needed for restore flow
            }
        } catch (e) {
            // No toast needed for restore flow
        } finally {
            e.target.value = '';
        }
    };

    loadConfig();
    setInterval(refreshLiveValues, 1000);
    </script>
</body>
</html>
